[package]
name = "shitshooter-launcher"
# Bump this when the launcher changes: launchers already out there see the new
# number in the latest release and replace themselves with the new build.
version = "1.2.1"
edition = "2024"

[[bin]]
name = "ShitShooterLauncher"
path = "src/main.rs"

[dependencies]
sha2 = "0.11.1"
ureq = "3"

[build-dependencies]
winresource = "0.1.34"
