[package]
name = "shitshooter-launcher"
# Bump this when the launcher changes: launchers already out there see the new
# number in the latest release and replace themselves with the new build.
version = "1.3.0"
edition = "2024"

[[bin]]
name = "ShitShooterLauncher"
path = "src/main.rs"

[dependencies]
# The launcher's window. OpenGL (glow) rather than wgpu keeps the launcher small
# and quick to open. The same winit version Bevy uses.
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
sha2 = "0.11.1"
ureq = "3"

[build-dependencies]
winresource = "0.1.34"
