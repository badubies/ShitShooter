# Every push to main builds the game and the launcher for Windows, macOS (Apple
# Silicon) and Linux (x86-64) and publishes them as a new GitHub release
# (build-1, build-2, ...). The launchers download from the latest release, so
# friends get each push the next time they start it. The release also carries
# the lobby server for Linux (a Raspberry Pi), which deploy/install.sh installs
# and keeps up to date.
#
# Each platform builds in its own job; the publish job waits for all of them,
# so a release always has every platform's files or is not made at all.
name: Release

on:
  push:
    branches: [main]
    # Edits to the README and other docs do not need a new build.
    paths-ignore: ["**.md"]
  # Lets you start a build by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

# Builds run one at a time, so releases come out in push order. If several
# pushes queue up, only the newest waiting one is built.
concurrency:
  group: release
  cancel-in-progress: false

env:
  SHITSHOOTER_BUILD: build-${{ github.run_number }}
  # The lobby server the game's menu lists by default (e.g. mypi.duckdns.org).
  # Set it under Settings > Secrets and variables > Actions > Variables; unset,
  # players type the address in themselves.
  SHITSHOOTER_LOBBY_SERVER: ${{ vars.SHITSHOOTER_LOBBY_SERVER }}
  # How many releases to keep. Older ones are deleted (with their tags).
  KEEP_RELEASES: 10

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Same as build-release.ps1: links the C runtime into the exe, so it runs
      # on PCs without the Visual C++ Redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --workspace

      # The servers alone, for Linux on 64-bit ARM (a Raspberry Pi on a 64-bit
      # OS), 32-bit ARM (older Pis and 32-bit Raspberry Pi OS) and x86-64. They
      # are static musl exes linked by rust-lld (.cargo/config.toml), so they
      # build here on Windows and run on any Linux.
      - name: Build the Linux servers
        shell: pwsh
        run: |
          $targets = 'aarch64-unknown-linux-musl', 'armv7-unknown-linux-musleabihf', 'x86_64-unknown-linux-musl'
          rustup target add @targets
          if ($LASTEXITCODE -ne 0) { exit 1 }
          foreach ($target in $targets) {
            cargo build --release --locked --no-default-features --target $target
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item target\release\shitshooter.exe out\
          Copy-Item target\release\ShitShooterLauncher.exe out\
          Copy-Item target\aarch64-unknown-linux-musl\release\shitshooter out\shitshooter-server-linux-arm64
          Copy-Item target\armv7-unknown-linux-musleabihf\release\shitshooter out\shitshooter-server-linux-armv7
          Copy-Item target\x86_64-unknown-linux-musl\release\shitshooter out\shitshooter-server-linux-x64
          # Every platform's launcher is built from the same source, so one
          # version number covers them all.
          $launcher = (& target\release\ShitShooterLauncher.exe --version).Trim()
          Set-Content out\launcher-version.txt $launcher -NoNewline
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/
          if-no-files-found: error

  # Apple Silicon Macs. The launcher downloads shitshooter-macos-arm64 and
  # updates itself from ShitShooterLauncher-macos-arm64; new players download
  # the .zip, which keeps the launcher's executable bit.
  macos:
    runs-on: macos-latest
    env:
      # Runs on macOS 11 (Big Sur) and newer, the first for Apple Silicon.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --workspace

      - name: Package
        run: |
          mkdir out
          cp target/release/shitshooter out/shitshooter-macos-arm64
          cp target/release/ShitShooterLauncher out/ShitShooterLauncher-macos-arm64
          # Rust's linker signs arm64 exes ad hoc, which macOS requires.
          codesign --verify --verbose target/release/shitshooter target/release/ShitShooterLauncher
          ditto -c -k target/release/ShitShooterLauncher out/ShitShooterLauncher-macos-arm64.zip
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/
          if-no-files-found: error

  # x86-64 Linux. Built on Ubuntu 24.04, so it needs glibc 2.39 or newer
  # (Ubuntu 24.04, Debian 13, Fedora 40, Mint 22, Arch and newer).
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Bevy's sound, gamepads and windows (X11 and Wayland).
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --workspace

      - name: Package
        run: |
          mkdir out
          cp target/release/shitshooter out/shitshooter-linux-x64
          cp target/release/ShitShooterLauncher out/ShitShooterLauncher-linux-x64
          tar -czf out/ShitShooterLauncher-linux-x64.tar.gz -C target/release ShitShooterLauncher
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/
          if-no-files-found: error

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Version and asset list
        shell: pwsh
        run: |
          Set-Content out/version.txt $env:SHITSHOOTER_BUILD -NoNewline
          # Asset list, one line per file under assets/: "<sha256> <size> <path>".
          # The launcher compares it with what is installed and downloads only
          # the files that changed. Assets are the same on every platform.
          $lines = @()
          if (Test-Path assets) {
            $root = (Resolve-Path assets).Path
            $lines = Get-ChildItem assets -Recurse -File | Sort-Object FullName | ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              $path = $_.FullName.Substring($root.Length + 1).Replace('\', '/')
              "$hash $($_.Length) $path"
            }
          }
          Set-Content out/assets.txt ($lines -join "`n") -NoNewline
          Get-ChildItem out
          Get-Content out/assets.txt

      # Asset files live in one release that is never deleted (tag "assets"),
      # each named by its hash, so a file is uploaded once and every later build
      # reuses it. This runs before the build is published, so the asset list
      # never points at files that are not there yet.
      - name: Upload new assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view assets --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create assets `
              --title "Game assets" `
              --notes "Models, textures and sounds for every build, named by their SHA-256 hash. The launcher downloads them from here. Do not delete this release." `
              --prerelease `
              --latest=false
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          $have = [System.Collections.Generic.HashSet[string]]::new(
            [string[]]@(gh release view assets --json assets --jq '.assets[].name'))
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory upload | Out-Null
          foreach ($line in Get-Content out/assets.txt) {
            if (-not $line) { continue }
            $hash, $size, $path = $line -split ' ', 3
            if ($have.Add($hash)) {
              Write-Host "New: $path ($hash)"
              Copy-Item (Join-Path assets $path) (Join-Path upload $hash)
            }
          }
          $new = @(Get-ChildItem upload -File)
          if ($new.Count -gt 0) {
            gh release upload assets $new.FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } else {
            Write-Host "No new asset files."
          }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $subject = git log -1 --pretty=%s
          @"
          $subject

          **New player?** Download the launcher for your computer below. It installs the game and keeps it up to date.

          - **Windows:** **ShitShooterLauncher.exe**. Right-click it → Properties → tick **Unblock** → OK, then run it.
          - **Mac (Apple Silicon):** **ShitShooterLauncher-macos-arm64.zip**. Unzip it and double-click **ShitShooterLauncher**. The first time, macOS refuses to open it: click **Done**, then go to System Settings → Privacy & Security, click **Open Anyway** next to ShitShooterLauncher, and double-click it again.
          - **Linux (x86-64):** **ShitShooterLauncher-linux-x64.tar.gz**. In a terminal: ``tar xzf ShitShooterLauncher-linux-x64.tar.gz && ./ShitShooterLauncher``

          Commit: $env:GITHUB_SHA
          "@ | Set-Content notes.md
          gh release create $env:SHITSHOOTER_BUILD (Get-ChildItem out).FullName `
            --target $env:GITHUB_SHA `
            --title "ShitShooter $env:SHITSHOOTER_BUILD" `
            --notes-file notes.md `
            --latest

      - name: Delete old releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Newest first. The "assets" release is shared by every build and is
          # never deleted.
          $builds = gh release list --limit 1000 --json tagName,createdAt `
            --jq 'sort_by(.createdAt) | reverse | .[].tagName'
          $old = $builds | Where-Object { $_ -and $_ -ne 'assets' } |
            Select-Object -Skip ([int]$env:KEEP_RELEASES)
          foreach ($tag in $old) {
            if ($tag) { gh release delete $tag --yes --cleanup-tag }
          }
