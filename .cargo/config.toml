# The servers build for Linux (a Raspberry Pi, a VPS) from any machine, with
# Rust's own linker: `cargo build --release --no-default-features --target
# aarch64-unknown-linux-musl`. musl makes a static exe that runs on any Linux.
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"

[target.x86_64-unknown-linux-musl]
linker = "rust-lld"

[target.armv7-unknown-linux-musleabihf]
linker = "rust-lld"
