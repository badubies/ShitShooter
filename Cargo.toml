[package]
name = "shitshooter"
version = "0.1.0"
edition = "2024"

[features]
default = ["client"]
# The game itself. Without it only the servers are built (`--server`, `--hub`),
# with none of Bevy's graphics, audio or windows, so they build for a
# Raspberry Pi or any Linux box: see "Running a lobby server" in the README.
client = ["bevy/default", "bevy/wav", "bevy/jpeg", "bevy/system_clipboard", "dep:winit"]

[dependencies]
# Only the math, unless the `client` feature adds the rest.
bevy = { version = "0.20.1", default-features = false, features = ["std"] }
postcard = { version = "1.2.0", features = ["use-std"] }
renet = { version = "2.0.1", default-features = false }
renet_netcode = { version = "2.0.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }

# Only for setting the window's icon: Bevy has no setting for it. Must stay the
# same winit version Bevy uses.
[target."cfg(windows)".dependencies]
winit = { version = "0.30", default-features = false, optional = true }

# Embeds icon.ico into the exe (see build.rs).
[build-dependencies]
winresource = "0.1.34"

# Light optimisation for our code, full optimisation for dependencies (Bevy is
# unusably slow at opt-level 0).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Leaves the debug info and symbols out of release builds, which makes the
# downloads much smaller. Crash messages keep their file and line, and only
# backtraces lose function names.
[profile.release]
strip = true

[workspace]
members = ["launcher"]
